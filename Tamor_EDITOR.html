{
<!-- Seating Plan Layout -->
<div id="seating-plan" class="seating-container">
  <!-- Top Row -->
  <div class="empty-space"></div>
  <div id="target-seat" class="seat">Dufry O.</div>
  <div class="seat">Zoril T.</div>
  <div class="seat">Kaelen M.</div>
  <div class="seat">Bexar K.</div>
  <div class="seat">Riven S.</div>

  <!-- Middle Row -->
  <div id="admiral-seat" class="seat">Admiral</div>
  <div class="table-center"></div>

  <!-- Bottom Row -->
  <div class="empty-space"></div>
  <div class="seat">Tarnis V.</div>
  <div class="seat">Soryn N.</div>
  <div class="seat">Luen R.</div>
  <div class="seat">Zaris R.</div>
  <div id="player-seat" class="seat">Jothro P.</div>
</div>

<!-- Output Terminal -->
<span id="hidden-swap-link" style="display:none; font-family:'Courier New', monospace; padding-left: 20px;">
  [[&gt;|Change made]] SEATING PLAN UPDATED.
</span>

<!-- Logic Script -->
<script>
  const playerSeat = document.getElementById('player-seat');
  const targetSeat = document.getElementById('target-seat');
  const seatingPlan = document.getElementById('seating-plan');
  
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  playerSeat.addEventListener('pointerdown', function(e) {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    
    // Disable the global screen flicker while dragging to focus the user
    seatingPlan.style.animation = 'none';
    
    playerSeat.style.transition = 'none'; 
    playerSeat.setPointerCapture(e.pointerId);
  });

  playerSeat.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    
    let dx = e.clientX - startX;
    let dy = e.clientY - startY;
    
    playerSeat.style.transform = `translate(${dx}px, ${dy}px)`;
  });

  playerSeat.addEventListener('pointerup', function(e) {
    if (!isDragging) return;
    isDragging = false;
    playerSeat.releasePointerCapture(e.pointerId);
    
    // Restore the screen flicker
    seatingPlan.style.animation = 'crtFlicker 0.15s infinite';

    const targetBox = targetSeat.getBoundingClientRect();
    
    if (
      e.clientX >= targetBox.left &&
      e.clientX <= targetBox.right &&
      e.clientY >= targetBox.top &&
      e.clientY <= targetBox.bottom
    ) {
      // SUCCESS 1: Target seat becomes Jothro P.
      targetSeat.style.animation = 'none'; /* Stop pulsing */
      targetSeat.style.backgroundColor = "rgba(0, 255, 255, 0.4)"; /* Bright fill */
      targetSeat.style.borderColor = "#ffffff";
      targetSeat.style.boxShadow = "0 0 15px #00ffff";
      targetSeat.innerHTML = "Jothro P.";
      
      // SUCCESS 2: Dragged seat becomes Dufry O. and slides back to bottom right
      playerSeat.innerHTML = "Dufry O.";
      playerSeat.style.transition = 'transform 0.3s ease';
      playerSeat.style.transform = 'translate(0px, 0px)';
      
      // SUCCESS 3: Strip the glowing ID so it looks like a standard seat and disable dragging
      playerSeat.removeAttribute('id');
      playerSeat.style.pointerEvents = 'none';
      
      let container = document.querySelector('#hidden-swap-link');
      let link = container.querySelector('tw-link');
      if (container) container.style.display = 'block';
      if (link) setTimeout(() => link.click(), 3000);
      
    } else {
      playerSeat.style.transition = 'transform 0.3s ease';
      playerSeat.style.transform = 'translate(0px, 0px)';
    }
  });
</script>
}
